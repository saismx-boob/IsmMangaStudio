name: Compilation Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Vous permet de lancer la compilation manuellement d'un clic

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code
    - name: Checkout du code
      uses: actions/checkout@v4

    # 2. Installer Java 17 (Standard actuel pour Android)
    - name: Configuration de Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Mettre en cache les dépendances pour accélérer les prochaines compilations
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # 4. Rendre le script Gradle exécutable
    - name: Rendre gradlew exécutable
      run: chmod +x ./gradlew

    # 5. Compiler l'APK de Debug
    - name: Compilation de l'APK (Debug)
      run: ./gradlew assembleDebug

    # 6. Compiler l'APK de Release (sans signature pour vérifier que le code compile)
    - name: Compilation de l'APK (Release)
      run: ./gradlew assembleRelease

    # 7. Sauvegarder l'APK de Debug pour pouvoir le télécharger
    - name: Upload de l'APK Debug
      uses: actions/upload-artifact@v4
      with:
        name: IsmMangaStudio-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

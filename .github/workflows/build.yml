name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Préparer le Keystore de Debug
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restauration du keystore de debug depuis debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Génération automatique d'un keystore de debug..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Préparer la configuration d'environnement (.env)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "Injection du secret GEMINI_API_KEY..."
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi

      - name: Compilation de l'APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload de l'APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
